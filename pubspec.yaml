name: profileflow_assistant
description: "ProfileFlow Assistant - Real Data Local Management and User-Controlled Form Assistance Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  provider: ^6.1.2
  
  # Embedded Browser & Form Engine
  webview_flutter: ^4.7.0
  
  # Local Storage & Encryption
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  path_provider: ^2.1.2
  
  # Biometrics & App Security
  local_auth: ^2.1.8
  
  # File & Image Management (Manual User Selection Only)
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  
  # Utilities & UI
  uuid: ^4.3.3
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
